[project]
name = "mts"
version = "0.1.0"
description = "Collect episode and chapter metadata from the 10th Planet MTS archive"
readme = "README.md"
authors = [
    { name = "Jorge Riquelme", email = "jorge@larix.cl" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.scripts]
mts = "mts.scrape_mts_toc:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
